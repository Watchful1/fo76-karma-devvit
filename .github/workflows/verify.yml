name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The snapshot is the empty placeholder
        run: |
          test "$(cat src/server/data/snapshot.json)" = '{"newestMs":0,"profiles":[],"rewards":[]}' \
            || { echo "src/server/data/snapshot.json holds real karma data: restore the placeholder"; exit 1; }
      - run: npx prettier --check .
      - run: npm run verify
